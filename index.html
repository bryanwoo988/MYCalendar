<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MY Calendar</title>
  <meta name="description" content="Malaysia lunar calendar with public holidays, school holidays and long weekends.">
  <meta name="theme-color" content="#0d1660">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MY Calendar">
  <!-- iPhone launch images (generated by scripts/build-icons.mjs) -->
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/splash-750x1334.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="icons/splash-828x1792.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1125x2436.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1170x2532.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1179x2556.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1284x2778.png">
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1290x2796.png">
  <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1206x2622.png">
  <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="icons/splash-1320x2868.png">
  <!-- Apply the saved theme before first paint to avoid a flash -->
  <script>
    (function () {
      var get = function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
      var mode = get("apMode", "system"), light = get("apLight", "classic"), dark = get("apDark", "midnight");
      var isDark = mode === "dark" || (mode === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      var el = document.documentElement;
      el.dataset.theme = isDark ? dark : light;
      el.dataset.scheme = isDark ? "dark" : "light";
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Splash screen: shown while the app starts, then fades out -->
  <div id="splash" class="splash" aria-hidden="true">
    <img src="icon.svg" alt="" width="96" height="96">
    <div class="splash-title">MY Calendar</div>
    <div class="splash-sub">马来西亚日历 · Kalendar MY</div>
    <div class="splash-dots"><i></i><i></i><i></i></div>
  </div>
  <div class="top">
    <header class="bar">
      <button id="back" class="icon-btn" data-i18n-aria="back" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="bar-title"></h1>
      <button id="cal-btn" class="icon-btn" data-i18n-aria="addToCalendar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9.5h17M8 3v4M16 3v4M12 12.5v5M9.5 15h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="menu-btn" class="icon-btn" data-i18n-aria="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/></svg>
      </button>
    </header>
    <div class="statebar">
      <button id="country-chip" class="country-chip" hidden></button>
      <label class="state-pick" id="state-pick">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" fill="currentColor"/></svg>
        <select id="state" data-i18n-aria="statePick"></select>
      </label>
    </div>
  </div>

  <!-- Home -->
  <main id="home" class="view">
    <nav id="years" class="years" aria-label="Year"></nav>
    <div id="cats" class="cats">
      <button class="cat cat-public" data-cat="public">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="2"/><path d="M7 13h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2zm-8 4h2v2H7zm4 0h2v2h-2z" fill="currentColor"/></svg>
        <span data-i18n="cat.public"></span>
      </button>
      <button class="cat cat-school" data-cat="school">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 1 9l11 5 9-4.1V16h2V9z" fill="currentColor"/><path d="M5 12.2V16c0 1.7 3.1 3 7 3s7-1.3 7-3v-3.8l-7 3.2z" fill="currentColor" opacity=".85"/></svg>
        <span data-i18n="cat.school"></span>
      </button>
      <button class="cat cat-long" data-cat="long">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span data-i18n="cat.long"></span>
      </button>
      <button class="cat cat-compare" data-cat="compare">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h11M3 6l3-3M3 6l3 3M21 18H10m11 0-3-3m3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="6" r="2.5" fill="currentColor"/><circle cx="6" cy="18" r="2.5" fill="currentColor"/></svg>
        <span data-i18n="cat.compare"></span>
      </button>
    </div>
    <section id="months" class="months" aria-label="Months"></section>
  </main>

  <!-- Month page -->
  <main id="month" class="view" hidden>
    <div class="page">
      <div class="page-head">
        <div>
          <div id="m-title" class="m-title"></div>
          <div id="m-sub" class="m-sub"></div>
        </div>
        <div class="m-side">
          <div class="m-nav">
            <button id="m-prev" class="round" data-i18n-aria="prevMonth">‹</button>
            <button id="m-next" class="round" data-i18n-aria="nextMonth">›</button>
          </div>
          <button id="z-toggle" class="z-toggle" role="switch" aria-checked="true">
            <span id="z-toggle-emoji" aria-hidden="true">🐎</span><span data-i18n="z.toggle"></span><span class="knob" aria-hidden="true"></span>
          </button>
        </div>
      </div>
      <div id="m-zodiac" class="zstrip" role="list"></div>
      <div id="m-grid" class="tgrid"></div>
      <p class="legend">
        <span><b class="sw sw-hol"></b><span data-i18n="legend.hol"></span></span>
        <span id="legend-part" hidden><b class="sw sw-part"></b><span data-i18n="legend.part"></span></span>
        <span><b class="sw sw-school"></b><span data-i18n="legend.school"></span></span>
        <span id="legend-fest"><b class="sw sw-fest">节</b><span data-i18n="legend.fest"></span></span>
        <span><b class="sw sw-evt"></b><span data-i18n="legend.evt"></span></span>
      </p>
    </div>
    <section class="memo">
      <h2 data-i18n="memo"></h2>
      <ul id="m-list" class="list"></ul>
    </section>
  </main>

  <!-- Category list -->
  <main id="list" class="view" hidden>
    <section class="memo">
      <div id="l-controls" class="l-controls" hidden></div>
      <div id="l-note" class="note"></div>
      <ul id="l-list" class="list"></ul>
    </section>
  </main>

  <!-- Day sheet -->
  <dialog id="day" class="sheet">
    <form method="dialog" class="sheet-close"><button data-i18n-aria="close">✕</button></form>
    <h3 id="d-title"></h3>
    <p id="d-sub" class="m-sub"></p>
    <ul id="d-list" class="list"></ul>
    <form id="evt-form" class="evt-form">
      <input id="evt-text" type="text" data-i18n-ph="evtPlaceholder" maxlength="120" required>
      <button type="submit" data-i18n="evtAdd"></button>
    </form>
  </dialog>

  <!-- First launch: choose a language -->
  <dialog id="lang-first" class="sheet lang-first" aria-labelledby="lf-title">
    <div class="lf-icon"><img src="icon.svg" alt="" width="56" height="56"></div>
    <h3 id="lf-title">Choose your language<br><small>选择语言 · Pilih bahasa</small></h3>
    <div class="lf-options">
      <button data-first-lang="en"><b>English</b><span>Malaysia calendar</span></button>
      <button data-first-lang="zh"><b>中文</b><span>马来西亚日历</span></button>
      <button data-first-lang="ms"><b>Bahasa Melayu</b><span>Kalendar Malaysia</span></button>
    </div>
    <p class="note center">You can change this later in ⋮ Settings · 之后可在 ⋮ 设置更改 · Boleh ditukar kemudian dalam ⋮ Tetapan</p>
  </dialog>

  <!-- Zodiac sign: birth years -->
  <dialog id="zodiac" class="sheet">
    <form method="dialog" class="sheet-close"><button data-i18n-aria="close">✕</button></form>
    <div class="z-head"><span id="z-emoji" class="z-emoji"></span><div><h3 id="z-title"></h3><p id="z-sub" class="m-sub"></p></div></div>
    <p class="note" data-i18n="z.note"></p>
    <ul id="z-list" class="list z-list"></ul>
  </dialog>

  <!-- Settings (⋮) -->
  <dialog id="menu" class="sheet">
    <form method="dialog" class="sheet-close"><button data-i18n-aria="close">✕</button></form>
    <h3 data-i18n="settings"></h3>

    <h4 data-i18n="set.country"></h4>
    <label class="field-select"><select id="country-sel"></select></label>

    <h4 data-i18n="set.language"></h4>
    <div id="lang-seg" class="seg wide" role="group"></div>

    <h4 data-i18n="set.display"></h4>
    <div id="display-switches" class="panel switches"></div>
    <p class="note" data-i18n="disp.note"></p>

    <h4 data-i18n="set.appearance"></h4>
    <div class="panel">
      <div id="ap-mode" class="seg wide" role="group"></div>
      <p class="note" data-i18n="ap.note"></p>
      <hr>
      <div class="panel-title" data-i18n="ap.lightTheme"></div>
      <div id="ap-light" class="swatches"></div>
      <hr>
      <div class="panel-title" data-i18n="ap.darkTheme"></div>
      <div id="ap-dark" class="swatches"></div>
    </div>

    <h4 data-i18n="set.share"></h4>
    <div class="panel share">
      <div id="qr" class="qr" aria-hidden="true"></div>
      <p class="note center" data-i18n="sh.scan"></p>
      <div class="url-row"><code id="share-url"></code></div>
      <div class="x-actions center">
        <button id="sh-native" class="x-btn primary" data-i18n="sh.native"></button>
        <a id="sh-wa" class="x-btn" target="_blank" rel="noopener" data-i18n="sh.whatsapp"></a>
        <button id="sh-copy" class="x-btn" data-i18n="sh.copy"></button>
      </div>
    </div>

    <h4 data-i18n="about.title"></h4>
    <div class="panel about">
      <div class="about-row"><span data-i18n="about.version"></span><b id="about-label"></b></div>
      <div class="x-actions">
        <button id="open-history" class="x-btn" data-i18n="about.history"></button>
        <button id="check-update" class="x-btn" data-i18n="about.check"></button>
      </div>
    </div>

    <details class="sources-box">
      <summary data-i18n="set.sources"></summary>
      <ul id="sources" class="sources"></ul>
    </details>
  </dialog>

  <!-- Phone calendar -->
  <dialog id="export" class="sheet">
    <form method="dialog" class="sheet-close"><button data-i18n-aria="close">✕</button></form>
    <h3 data-i18n="x.title"></h3>
    <p id="x-state" class="m-sub"></p>
    <h4 data-i18n="x.subscribe"></h4>
    <p class="note" data-i18n="x.subNote"></p>
    <div class="x-actions">
      <a id="x-webcal" class="x-btn primary" href="#" data-i18n="x.iphone"></a>
      <a id="x-google" class="x-btn" href="#" target="_blank" rel="noopener" data-i18n="x.android"></a>
    </div>
    <p id="x-feed-note" class="note"></p>
    <h4 data-i18n="x.download"></h4>
    <div class="x-opts">
      <label><input type="checkbox" id="x-public" checked> <span data-i18n="x.public"></span></label>
      <label><input type="checkbox" id="x-school" checked> <span data-i18n="x.school"></span></label>
      <label><input type="checkbox" id="x-mine"> <span data-i18n="x.mine"></span></label>
    </div>
    <div id="x-years" class="x-opts"></div>
    <div class="x-actions">
      <button id="x-download" class="x-btn primary" data-i18n="x.btn"></button>
    </div>
    <p class="note" data-i18n="x.howto"></p>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/vendor/qrcode.js"></script>
  <script src="whatsnew.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
